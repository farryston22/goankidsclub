<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goan Kids Club – Learn, Play, Discover</title>
<meta name="description" content="Goan Kids Club: free learning games for children aged 3 to 6, with Konkani and Goan heritage. No ads.">
<meta name="theme-color" content="#1D4F91">
<link rel="icon" href="games/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="games/icons/icon-180.png">
<meta property="og:title" content="Goan Kids Club – Learn, Play, Discover">
<meta property="og:description" content="Free learning games for children aged 3 to 6, with Konkani and Goan heritage. No ads.">
<meta property="og:image" content="https://goankidsclub.com/logo.png">
<meta property="og:url" content="https://goankidsclub.com/">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Colours from the Goan Kids Club logo */
  :root { --cream: #FDFBF3; --navy: #142B57; --blue: #1D4F91; --yellow: #F3B72B; --orange: #E5572B; --green: #3A8A3F; --sea: #4EA6DC; --ring: #F8C33A; --muted: #5E6787; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--cream); color: var(--navy); font: 500 18px/1.4 Fredoka, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; }
  .badge { width: min(380px, 84vw); margin: 0 0 14px; line-height: 0; }
  .badge img { width: 100%; height: auto; display: block; }
  .word { line-height: .95; }
  .word .g { font-size: clamp(56px, 14vw, 88px); font-weight: 700; letter-spacing: -1px; }
  .word .k { display: block; font-size: clamp(30px, 7vw, 46px); font-weight: 700; color: var(--navy); }
  .c1 { color: var(--blue); } .c2 { color: var(--yellow); } .c3 { color: var(--orange); } .c4 { color: var(--green); }
  .wave { width: 150px; height: 18px; margin: 10px auto 4px; display: block; }
  .tag { letter-spacing: 3px; font-weight: 600; font-size: 16px; color: var(--navy); margin: 4px 0 18px; }
  .tag i { font-style: normal; } .tag .d1 { color: var(--orange); } .tag .d2 { color: var(--green); }
  p { color: var(--muted); max-width: 520px; margin: 0 auto 22px; }
  a.play { display: inline-block; background: var(--yellow); color: var(--navy); text-decoration: none; font-weight: 700; font-size: 26px;
    padding: 18px 40px; border-radius: 999px; box-shadow: 0 6px 0 #C9901B; }
  a.play:active { transform: translateY(3px); box-shadow: 0 3px 0 #C9901B; }
  small { display: block; margin-top: 26px; color: var(--muted); }
</style>
</head>
<body>
  <h1 class="badge">
    <picture>
      <source srcset="logo.webp" type="image/webp">
      <img src="logo.png" width="640" height="640" alt="Goan Kids Club – Learn, Play, Discover">
    </picture>
  </h1>
  <p>Fun learning games for ages 3 to 6: numbers, phonics, shapes, animals, Konkani and Goan heritage.</p>
  <a class="play" href="games/">▶ Play games</a>
  <small>No ads · No sign-up · Works on iPad, phone and computer</small>
</body>
</html>
